<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#02172d" flood-opacity="0.15" />
    </filter>
    <linearGradient id="tanFurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a647" />
      <stop offset="100%" stop-color="#df8124" />
    </linearGradient>
    <linearGradient id="blackCoatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e36" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <linearGradient id="leatherBeltGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c98236" />
      <stop offset="100%" stop-color="#9a5b18" />
    </linearGradient>
    <linearGradient id="redVestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d91e18" />
      <stop offset="100%" stop-color="#9b0c0a" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- ================= RIGHT SIDE: SIGN / PLAQUE ================= -->
  <g id="plaqueSign" filter="url(#softShadow)">
    <!-- Outer light border -->
    <path 
      d="M 215 145 
         C 260 128, 340 120, 410 120 
         C 475 120, 520 128, 528 140 
         L 535 150 
         L 535 290 
         L 525 302 
         L 215 302 
         L 205 290 
         L 205 155 Z" 
      fill="#ffffff" 
      stroke="#b0bec5" 
      stroke-width="3" 
      stroke-linejoin="round"
    />
    <!-- Inner navy border with notched beveled corners -->
    <path 
      d="M 222 150 
         C 265 135, 340 128, 410 128 
         C 470 128, 515 135, 520 146 
         L 524 156 
         L 524 284 
         L 516 294 
         L 224 294 
         L 214 284 
         L 214 158 Z" 
      fill="#ffffff" 
      stroke="#0a2540" 
      stroke-width="4.5" 
      stroke-linejoin="round"
    />

    <!-- Accent corner cut notches on inner sign -->
    <line x1="214" y1="168" x2="228" y2="152" stroke="#0a2540" stroke-width="2.5" />
    <line x1="510" y1="152" x2="524" y2="168" stroke="#0a2540" stroke-width="2.5" />
    <line x1="214" y1="274" x2="228" y2="288" stroke="#0a2540" stroke-width="2.5" />
    <line x1="510" y1="288" x2="524" y2="274" stroke="#0a2540" stroke-width="2.5" />

    <!-- Sign Typography: NORTH EAST -->
    <text 
      x="372" 
      y="182" 
      text-anchor="middle" 
      fill="#0a2540" 
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
      font-size="40" 
      font-weight="900" 
      letter-spacing="2.5"
    >
      NORTH EAST
    </text>

    <!-- Sign Typography: ROOFING -->
    <text 
      x="372" 
      y="242" 
      text-anchor="middle" 
      fill="#0a2540" 
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
      font-size="62" 
      font-weight="900" 
      letter-spacing="2"
    >
      ROOFING
    </text>

    <!-- Sub-banner: & HOME IMPROVEMENT -->
    <g transform="translate(242, 258)">
      <!-- Pill boundary -->
      <rect 
        x="0" 
        y="0" 
        width="260" 
        height="26" 
        rx="13" 
        ry="13" 
        fill="#ffffff" 
        stroke="#0a2540" 
        stroke-width="2.5" 
      />
      <!-- Left 4-point star -->
      <path 
        d="M 16 13 Q 21 13 21 8 Q 21 13 26 13 Q 21 13 21 18 Q 21 13 16 13 Z" 
        fill="#0a2540" 
      />
      <!-- Center text -->
      <text 
        x="130" 
        y="18.5" 
        text-anchor="middle" 
        fill="#0a2540" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="800" 
        letter-spacing="1.2"
      >
        &amp; HOME IMPROVEMENT
      </text>
      <!-- Right 4-point star -->
      <path 
        d="M 234 13 Q 239 13 239 8 Q 239 13 244 13 Q 239 13 239 18 Q 239 13 234 13 Z" 
        fill="#0a2540" 
      />
    </g>
  </g>

  <!-- ================= LEFT SIDE: GERMAN SHEPHERD MASCOT ================= -->
  <g id="germanShepherdMascot" filter="url(#softShadow)">
    
    <!-- Tail (Curling upward on left) -->
    <g id="tail">
      <!-- Tail base and black curve -->
      <path 
        d="M 75 240 
           C 40 215, 12 210, 8 240 
           C 5 265, 30 270, 58 255 
           L 70 248 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
        stroke-linejoin="round" 
      />
      <!-- Tail tip / fluff tan highlight -->
      <path 
        d="M 14 225 
           C 10 235, 12 250, 24 256 
           C 18 248, 18 238, 22 230 Z" 
        fill="url(#tanFurGrad)" 
        stroke="#0a2540" 
        stroke-width="1.5" 
      />
    </g>

    <!-- Hind Legs & Haunches -->
    <g id="hindLegs">
      <!-- Back Far Leg -->
      <path 
        d="M 60 255 L 50 340 L 45 385 L 68 385 L 75 345 L 85 270 Z" 
        fill="#c26f1c" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
      <!-- Back Near Leg & Rump -->
      <!-- Thigh (Black & Tan) -->
      <path 
        d="M 80 230 
           C 55 240, 50 270, 55 295 
           C 60 320, 80 340, 95 345 
           L 88 385 
           L 115 385 
           L 125 340 
           C 135 305, 130 250, 95 235 Z" 
        fill="url(#tanFurGrad)" 
        stroke="#0a2540" 
        stroke-width="3.5" 
      />
      <!-- Black saddle on rump -->
      <path 
        d="M 80 230 
           C 62 240, 56 265, 60 282 
           C 72 275, 88 260, 100 240 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="2" 
      />
      <!-- Paw toes & claws -->
      <path d="M 98 385 L 98 375 M 106 385 L 106 375" stroke="#0a2540" stroke-width="2.5" />
      <path d="M 52 385 L 52 376 M 60 385 L 60 376" stroke="#0a2540" stroke-width="2.5" />
    </g>

    <!-- Torso & Black Back Coat -->
    <g id="torso">
      <!-- Tan belly & flank -->
      <path 
        d="M 85 240 
           L 180 220 
           L 175 300 
           C 150 310, 110 300, 85 265 Z" 
        fill="url(#tanFurGrad)" 
      />
      <!-- Black coat saddle -->
      <path 
        d="M 85 230 
           C 115 220, 145 210, 175 205 
           L 170 245 
           C 140 260, 110 265, 80 245 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
    </g>

    <!-- Front Legs -->
    <g id="frontLegs">
      <!-- Front Far Leg -->
      <path 
        d="M 140 260 L 132 345 L 126 385 L 152 385 L 158 340 L 165 260 Z" 
        fill="#c26f1c" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
      <!-- Front Near Leg -->
      <path 
        d="M 175 250 
           L 170 335 
           L 165 385 
           L 194 385 
           L 198 335 
           L 205 255 Z" 
        fill="url(#tanFurGrad)" 
        stroke="#0a2540" 
        stroke-width="3.5" 
      />
      <!-- Front Paws details -->
      <path d="M 174 385 L 174 374 M 184 385 L 184 374" stroke="#0a2540" stroke-width="2.5" />
      <path d="M 134 385 L 134 375 M 142 385 L 142 375" stroke="#0a2540" stroke-width="2" />
    </g>

    <!-- Contractor Tool Belt & Tools -->
    <g id="contractorToolBelt">
      <!-- Red vest collar around neck -->
      <path 
        d="M 138 185 
           L 195 190 
           L 200 225 
           C 180 235, 150 235, 132 215 Z" 
        fill="url(#redVestGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
      <!-- White House Silhouette on Red Vest -->
      <polygon points="166,200 178,190 190,200" fill="#ffffff" stroke="#0a2540" stroke-width="1.5" />
      <rect x="170" y="200" width="16" height="12" fill="#ffffff" stroke="#0a2540" stroke-width="1.5" />
      <rect x="175" y="204" width="6" height="8" fill="#d91e18" />

      <!-- Leather Belt across waist -->
      <path 
        d="M 85 240 
           C 115 250, 145 250, 185 235 
           L 185 255 
           C 145 270, 115 270, 85 255 Z" 
        fill="url(#leatherBeltGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
      />

      <!-- Leather Tool Pouch on Left -->
      <rect 
        x="95" 
        y="245" 
        width="38" 
        height="32" 
        rx="5" 
        fill="#b8691f" 
        stroke="#0a2540" 
        stroke-width="2.5" 
      />
      <!-- Pouch pocket front flap -->
      <path d="M 95 255 C 105 262, 125 262, 133 255" fill="none" stroke="#0a2540" stroke-width="2" />
      <!-- Golden rivet -->
      <circle cx="114" cy="265" r="2.5" fill="#fcd34d" stroke="#0a2540" stroke-width="1" />

      <!-- Tools Sticking Out of Pouch -->
      <!-- Red Screwdriver / Chisel -->
      <g transform="translate(100, 222) rotate(-15)">
        <rect x="0" y="0" width="6" height="22" rx="2" fill="#ef4444" stroke="#0a2540" stroke-width="1.5" />
        <rect x="2" y="-8" width="2.5" height="10" fill="url(#steelGrad)" stroke="#0a2540" stroke-width="1.2" />
      </g>
      <!-- Yellow Utility Knife -->
      <g transform="translate(112, 224) rotate(5)">
        <rect x="0" y="0" width="7" height="20" rx="2" fill="#facc15" stroke="#0a2540" stroke-width="1.5" />
        <circle cx="3.5" cy="14" r="1.5" fill="#0a2540" />
      </g>
      <!-- Steel Claw Hammer in side leather loop -->
      <g transform="translate(122, 225) rotate(20)">
        <path d="M -3 3 L 8 3 L 7 30 L -2 30 Z" fill="#94a3b8" stroke="#0a2540" stroke-width="1.5" />
        <!-- Hammer Head -->
        <path d="M -12 2 L 15 2 L 17 -4 L -8 -4 C -12 -2, -14 0, -12 2 Z" fill="url(#steelGrad)" stroke="#0a2540" stroke-width="1.8" />
      </g>

      <!-- Carpenter's Folding Ruler / Pencil on Right -->
      <g transform="translate(182, 235) rotate(-35)">
        <rect x="0" y="0" width="7" height="35" rx="1" fill="#fef08a" stroke="#0a2540" stroke-width="1.8" />
        <line x1="2" y1="5" x2="6" y2="5" stroke="#0a2540" stroke-width="1" />
        <line x1="2" y1="12" x2="6" y2="12" stroke="#0a2540" stroke-width="1" />
        <line x1="2" y1="19" x2="6" y2="19" stroke="#0a2540" stroke-width="1" />
        <line x1="2" y1="26" x2="6" y2="26" stroke="#0a2540" stroke-width="1" />
      </g>
    </g>

    <!-- German Shepherd Head & Ears -->
    <g id="head">
      <!-- Left Ear (Far) -->
      <path 
        d="M 135 125 
           L 142 62 
           C 144 55, 150 56, 155 68 
           L 168 120 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
      <!-- Left Inner Ear (Tan / Salmon) -->
      <path 
        d="M 143 115 
           L 147 75 
           L 158 115 Z" 
        fill="#f87171" 
        opacity="0.85" 
      />

      <!-- Right Ear (Near) -->
      <path 
        d="M 178 115 
           L 204 55 
           C 208 50, 214 52, 215 65 
           L 212 125 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="3" 
      />
      <!-- Right Inner Ear (Tan / Salmon) -->
      <path 
        d="M 186 112 
           L 204 68 
           L 206 112 Z" 
        fill="#f87171" 
        opacity="0.85" 
      />

      <!-- Head Contour (Tan fur) -->
      <path 
        d="M 136 140 
           C 134 118, 160 110, 185 110 
           C 205 110, 218 122, 216 145 
           C 225 160, 222 185, 205 195 
           C 190 205, 155 205, 140 190 
           C 130 175, 130 155, 136 140 Z" 
        fill="url(#tanFurGrad)" 
        stroke="#0a2540" 
        stroke-width="3.5" 
      />

      <!-- Black Face Mask & Forehead -->
      <path 
        d="M 152 112 
           C 168 110, 182 110, 196 112 
           C 192 135, 196 148, 190 155 
           C 185 145, 162 145, 158 155 
           C 152 145, 154 130, 152 112 Z" 
        fill="url(#blackCoatGrad)" 
      />

      <!-- Tan Eyebrow Highlights -->
      <ellipse cx="160" cy="125" rx="3.5" ry="2.5" fill="#f5a647" />
      <ellipse cx="188" cy="125" rx="3.5" ry="2.5" fill="#f5a647" />

      <!-- Eyes (Friendly, bold cartoon eyes) -->
      <!-- Left Eye -->
      <circle cx="163" cy="138" r="7" fill="#ffffff" stroke="#0a2540" stroke-width="2" />
      <circle cx="164" cy="138" r="4.5" fill="#5a2e0a" />
      <circle cx="164" cy="138" r="3" fill="#000000" />
      <circle cx="162" cy="136" r="1.8" fill="#ffffff" />

      <!-- Right Eye -->
      <circle cx="185" cy="138" r="7" fill="#ffffff" stroke="#0a2540" stroke-width="2" />
      <circle cx="186" cy="138" r="4.5" fill="#5a2e0a" />
      <circle cx="186" cy="138" r="3" fill="#000000" />
      <circle cx="184" cy="136" r="1.8" fill="#ffffff" />

      <!-- Muzzle & Snout (Black mask on muzzle) -->
      <path 
        d="M 160 150 
           C 165 145, 182 145, 187 150 
           C 194 165, 190 180, 174 182 
           C 158 180, 154 165, 160 150 Z" 
        fill="url(#blackCoatGrad)" 
        stroke="#0a2540" 
        stroke-width="2.5" 
      />

      <!-- Black Nose -->
      <path 
        d="M 168 152 
           C 171 149, 177 149, 180 152 
           C 181 156, 178 160, 174 160 
           C 170 160, 167 156, 168 152 Z" 
        fill="#0a2540" 
      />
      <!-- Nose highlight -->
      <ellipse cx="172" cy="153" rx="1.5" ry="0.8" fill="#ffffff" opacity="0.6" />

      <!-- Mouth & Happy Pink Tongue Hanging Out -->
      <path d="M 167 165 C 171 168, 177 168, 181 165" fill="none" stroke="#0a2540" stroke-width="2" stroke-linecap="round" />
      <!-- Tongue -->
      <path 
        d="M 170 167 
           C 168 178, 172 186, 176 186 
           C 180 186, 182 178, 178 167 Z" 
        fill="#fb7185" 
        stroke="#0a2540" 
        stroke-width="1.8" 
      />
      <!-- Tongue middle line -->
      <line x1="174" y1="168" x2="175" y2="182" stroke="#e11d48" stroke-width="1" />
    </g>
  </g>

  <!-- ================= TOP LEFT: SPEECH BUBBLE ================= -->
  <g id="speechBubble" filter="url(#softShadow)">
    <!-- Speech bubble outline & tail pointing to dog mouth -->
    <path 
      d="M 45 80 
         C 32 80, 24 92, 24 105 
         C 24 118, 30 130, 42 135 
         C 45 138, 52 142, 60 144 
         L 72 165 
         L 85 144 
         C 125 144, 138 132, 138 112 
         C 138 92, 122 80, 85 80 Z" 
      fill="#ffffff" 
      stroke="#0a2540" 
      stroke-width="3.5" 
      stroke-linejoin="round"
    />
    <!-- 3 Stacked ROOF! text lines -->
    <text 
      x="80" 
      y="98" 
      text-anchor="middle" 
      fill="#0a2540" 
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
      font-size="16" 
      font-weight="900" 
      letter-spacing="1"
    >
      ROOF!
    </text>
    <text 
      x="80" 
      y="116" 
      text-anchor="middle" 
      fill="#0a2540" 
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
      font-size="16" 
      font-weight="900" 
      letter-spacing="1"
    >
      ROOF!
    </text>
    <text 
      x="80" 
      y="134" 
      text-anchor="middle" 
      fill="#0a2540" 
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
      font-size="16" 
      font-weight="900" 
      letter-spacing="1"
    >
      ROOF!
    </text>
  </g>
</svg>